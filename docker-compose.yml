version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  web:
    build: .
    container_name: gestionrh-web
    depends_on:
      - ollama
    environment:
      - PORT=8000
      - OLLAMA_URL=https://drink-falling-cross-begin.trycloudflare.com
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "python manage.py migrate && gunicorn backend.wsgi:application --bind 0.0.0.0:8000"

volumes:
  ollama-data:
    name: ollama-data
